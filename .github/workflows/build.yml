name: Build RemoteAd
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK tools
        run: |
          JAR=$(ls -d $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -1)
          D8=$(ls -d $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -1)
          echo "ANDROID_JAR=$JAR" >> $GITHUB_ENV
          echo "D8=$D8" >> $GITHUB_ENV
      - name: Build
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteAd-build
          path: out/classes.dex
